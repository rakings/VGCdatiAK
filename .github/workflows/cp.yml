name: CP - classifica Pokedata
on:
  workflow_dispatch:
    inputs:
      salva:
        description: "no = solo prova, non salva nulla - si = salva i file in dati/cp/"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "si"
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
jobs:
  cp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Leggi la classifica
        env:
          SALVA: ${{ github.event_name == 'schedule' && 'si' || inputs.salva }}
        run: |
          if [ "$SALVA" = "si" ]; then python3 cp_pokedata.py --write; else python3 cp_pokedata.py; fi
      - name: Pubblica su GitHub
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -d dati ]; then git add dati; fi
          if git diff --cached --quiet; then echo "Niente da pubblicare."; else git commit -m "CP: aggiornamento classifica" && git pull --rebase && git push; fi
